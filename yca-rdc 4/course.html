<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formation | YCA RDC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<section class="section"><div class="container" style="max-width:980px" id="wrap"></div></section>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/components.js"></script>
<script>
  mountLayout('academy.html');
  var S=YCA;
  var id=new URLSearchParams(location.search).get('id');
  var f=S.find('courses',id)||S.get('courses')[0];
  if(f){
    document.title=f.title+' | YCA Academy';
    var typeLbl={gratuite:'GRATUITE',payante:'PAYANTE',premium:'PREMIUM'}[f.type]||'';
    var price=f.price===0?'<span class="price"><span class="free">Gratuit</span></span>':'<span class="price">'+f.price+' $</span>';
    var action=(f.paymentUrl&&f.price>0)?'<a class="btn btn-primary" target="_blank" rel="noopener" href="'+esc(f.paymentUrl)+'">Payer maintenant</a>':'<a class="btn btn-primary" href="student-space.html">'+(f.price===0?'Commencer gratuitement':'S’inscrire à la formation')+'</a>';
    if(f.videoUrl) action='<a class="btn btn-dark" target="_blank" rel="noopener" href="'+esc(f.videoUrl)+'">▶ Voir la vidéo</a> '+action;
    if(f.accessUrl) action+='<a class="btn btn-light" target="_blank" rel="noopener" href="'+esc(f.accessUrl)+'">Accéder au contenu</a>';
    var mods='';for(var i=1;i<=(f.modules||1);i++){mods+='<div class="panel" style="padding:16px 20px;margin-bottom:10px"><div class="flex between aic"><strong>Module '+i+'</strong><span class="muted" style="font-size:.85rem">🎥 vidéo · 📄 ressources</span></div></div>';}
    var incl=['🎥 Vidéos de cours','📄 Fichiers téléchargeables','❓ Quiz d’évaluation','🏆 Certificat de réussite','📈 Suivi de progression'];
    wrap.innerHTML='<div class="breadcrumb"><a href="index.html">Accueil</a> / <a href="academy.html">Academy</a> / '+esc(f.cat)+'</div>'
      +'<div class="grid" style="grid-template-columns:1fr;gap:26px">'
      +'<div><img src="'+esc(f.thumb)+'" alt="'+esc(f.title)+'" style="width:100%;border-radius:16px;margin-bottom:18px">'
      +'<div class="flex wrap gap" style="gap:6px"><span class="tag">'+esc(f.cat)+'</span><span class="chip chip-red" style="font-size:.7rem">'+typeLbl+'</span></div>'
      +'<h1 style="margin:12px 0">'+esc(f.title)+'</h1><p class="lead">'+esc(f.desc)+'</p>'
      +'<div class="creator-meta" style="justify-content:flex-start;margin-top:12px"><span>👨‍🏫 '+esc(f.trainer)+'</span><span>📊 '+esc(f.level)+'</span><span>⏱️ '+esc(f.duration)+'</span><span>📚 '+f.modules+' modules</span></div>'
      +'<div class="panel mt" style="margin-top:20px"><div class="flex between wrap gap aic"><div>'+price+'</div>'+action+'</div>'
      +'<div class="divider"></div><div class="progress"><i style="width:0%"></i></div><p class="muted mt" style="font-size:.82rem">Votre progression apparaîtra ici une fois inscrit.</p></div>'
      +'<h3 class="mt" style="margin-top:24px">Programme</h3><div class="mt">'+mods+'</div>'
      +'<h3 class="mt" style="margin-top:20px">Ce que comprend la formation</h3><ul class="mt" style="list-style:none">'+incl.map(function(x){return '<li style="padding:6px 0">'+x+'</li>';}).join('')+'</ul>'
      +'<a class="btn btn-ghost btn-sm mt" href="academy.html">← Toutes les formations</a></div></div>';
  }
</script>
</body>
</html>
