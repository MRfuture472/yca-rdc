<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Média & Blog | YCA RDC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero"><div class="container">
  <div class="breadcrumb"><a href="index.html">Accueil</a> / Média</div>
  <h1>Média & Blog</h1>
  <p>Actualités YouTube, portraits de créateurs, interviews, tutoriels, analyses et annonces YCA RDC.</p>
</div></section>

<section class="section"><div class="container">
  <div class="toolbar">
    <div class="search"><input id="q" placeholder="Rechercher un article..." oninput="render()"></div>
    <select class="select" id="fCat" onchange="render()"><option value="">Toutes les catégories</option></select>
  </div>
  <div class="grid g3" id="list"></div>
</div></section>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/components.js"></script>
<script>
  mountLayout('media.html');
  var S=YCA,C=YCAC,all=S.get('articles');
  S.get('articleCategories').forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;fCat.appendChild(o);});
  function render(){var q=document.getElementById('q').value.toLowerCase(),cat=fCat.value;var res=all.filter(function(a){return (!q||(a.title+a.excerpt).toLowerCase().indexOf(q)>=0)&&(!cat||a.cat===cat);});list.innerHTML=res.map(C.articleCard).join('');document.querySelectorAll('.reveal').forEach(function(e){e.classList.add('in');});}
  window.render=render;render();
</script>
</body>
</html>
