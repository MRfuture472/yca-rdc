<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accès privé | YCA RDC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Ecran de connexion -->
<div id="login" class="login-wrap">
  <form class="login-card" onsubmit="return doLogin(event)">
    <div class="logo" style="margin-bottom:20px"><span class="logo-mark"></span><span>YCA RDC<small>Administration</small></span></div>
    <h2 style="margin-bottom:6px">Connexion sécurisée</h2>
    <p class="muted mb" style="font-size:.9rem">Accès réservé à l’équipe YCA RDC.</p>
    <div id="loginErr" class="alert alert-warn hide">Identifiants incorrects.</div>
    <div class="field"><label>Identifiant</label><input class="input" id="u" value="henock" autocomplete="username"></div>
    <div class="field"><label>Mot de passe</label><input class="input" type="password" id="p" placeholder="••••••" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block">Se connecter</button>
    <p class="form-note">Accès privé : identifiant <strong>henock</strong>. Le mot de passe est demandé à la connexion.</p>
  </form>
</div>

<!-- Tableau de bord -->
<div id="app" class="admin-shell hide">
  <aside class="admin-side">
    <div class="logo"><span class="logo-mark"></span><span>YCA RDC<small>Admin</small></span></div>
    <div id="menu"></div>
    <div style="margin-top:auto;padding-top:14px"><a onclick="logout()">↪ Se déconnecter</a><a href="index.html">← Voir le site</a></div>
  </aside>
  <main class="admin-main">
    <div class="admin-top"><h2 id="pageTitle">Dashboard</h2><span class="chip chip-red" id="clock"></span></div>
    <div id="view"></div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/components.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
