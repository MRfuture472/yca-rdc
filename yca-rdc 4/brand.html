<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace Marque | YCA RDC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero"><div class="container">
  <div class="breadcrumb"><a href="index.html">Accueil</a> / Espace Marque</div>
  <h1>Vous êtes une marque ? Travaillez avec les créateurs congolais.</h1>
  <p>Déposez votre demande de campagne. Notre équipe vous met en relation avec les créateurs YouTube adaptés à vos objectifs.</p>
</div></section>

<section class="section"><div class="container" style="max-width:720px">
  <div id="ok" class="alert alert-ok hide"><strong>Demande envoyée !</strong> Notre équipe vous contactera rapidement.</div>
  <form class="form-card reveal" id="form" onsubmit="return send(event)">
    <div class="form-row c2"><div class="field"><label>Entreprise <span class="req">*</span></label><input class="input" id="ent" required></div><div class="field"><label>Nom du responsable <span class="req">*</span></label><input class="input" id="resp" required></div></div>
    <div class="form-row c2"><div class="field"><label>Email <span class="req">*</span></label><input type="email" class="input" id="mail" required></div><div class="field"><label>Téléphone</label><input class="input" id="tel"></div></div>
    <div class="form-row c2"><div class="field"><label>Budget</label><input class="input" id="budget" placeholder="ex : 5 000 $"></div><div class="field"><label>Type de campagne</label><input class="input" id="ctype" placeholder="lancement, notoriété..."></div></div>
    <div class="form-row c2"><div class="field"><label>Plateformes</label><input class="input" id="plats" placeholder="YouTube, TikTok..."></div><div class="field"><label>Audience recherchée</label><input class="input" id="aud"></div></div>
    <div class="form-row c2"><div class="field"><label>Nombre de créateurs</label><input class="input" id="nb"></div><div class="field"><label>Date souhaitée</label><input type="date" class="input" id="date"></div></div>
    <div class="field"><label>Description de la campagne <span class="req">*</span></label><textarea class="textarea" id="desc" required></textarea></div>
    <button class="btn btn-primary btn-block">Envoyer une demande</button>
  </form>
</div></section>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/email.js"></script>
<script src="js/app.js"></script>
<script>
  mountLayout('brand.html');
  var S=YCA;
  window.send=async function(e){e.preventDefault();
    var btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Envoi en cours…';
    var payload={company:ent.value,contact:resp.value,email:mail.value,phone:tel.value,budget:budget.value,type:ctype.value,platforms:plats.value,audience:aud.value,creators:nb.value,date:date.value,desc:desc.value,received:new Date().toISOString().slice(0,10),status:'nouvelle'};
    S.add('brandRequests',payload);
    try{await YCAEmail.send('Nouvelle demande de campagne — YCA RDC',{Entreprise:payload.company,Responsable:payload.contact,Email:payload.email,Téléphone:payload.phone,Budget:payload.budget,'Type de campagne':payload.type,Plateformes:payload.platforms,Audience:payload.audience,'Nombre de créateurs':payload.creators,'Date souhaitée':payload.date,Description:payload.desc});document.getElementById('ok').textContent='Demande reçue et notification envoyée par email.';}
    catch(err){document.getElementById('ok').textContent='Demande enregistrée. La notification email doit encore être configurée.';console.error(err);}
    document.getElementById('ok').classList.remove('hide');document.getElementById('form').classList.add('hide');window.scrollTo({top:0,behavior:'smooth'});return false;};
  document.querySelectorAll('.reveal').forEach(function(e){e.classList.add('in');});
</script>
</body>
</html>
