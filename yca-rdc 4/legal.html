<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Informations légales | YCA RDC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero"><div class="container">
  <div class="breadcrumb"><a href="index.html">Accueil</a> / Légal</div>
  <h1>Informations légales</h1>
  <p>Toutes nos politiques et conditions. Les textes sont gérés depuis l’administration.</p>
</div></section>

<section class="section"><div class="container" style="max-width:820px">
  <div class="flex wrap gap mb" id="toc"></div>
  <div id="content"></div>
</div></section>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  mountLayout('index.html');
  var legal=YCA.get('legal');
  document.getElementById('toc').innerHTML=legal.map(function(l){return '<a class="chip" href="#'+l.id+'">'+esc(l.title)+'</a>';}).join('');
  document.getElementById('content').innerHTML=legal.map(function(l){return '<div class="panel" id="'+l.id+'" style="scroll-margin-top:90px"><h2>'+esc(l.title)+'</h2><p class="mt">'+esc(l.body)+'</p></div>';}).join('');
  if(location.hash){var t=document.querySelector(location.hash);if(t)setTimeout(function(){t.scrollIntoView();},100);}
</script>
</body>
</html>
