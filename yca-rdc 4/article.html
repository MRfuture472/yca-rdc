<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article | YCA RDC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<article class="section"><div class="container" style="max-width:800px" id="art"></div></article>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/components.js"></script>
<script>
  mountLayout('media.html');
  var S=YCA;
  var id=new URLSearchParams(location.search).get('id');
  var a=S.find('articles',id)||S.get('articles')[0];
  if(a){
    document.title=a.title+' | YCA RDC';
    var soc=S.get('social');
    var tags=(a.tags||[]).map(function(t){return '<span class="tag">#'+esc(t)+'</span>';}).join(' ');
    art.innerHTML='<div class="breadcrumb"><a href="index.html">Accueil</a> / <a href="media.html">Média</a> / '+esc(a.cat)+'</div>'
      +'<span class="chip chip-red">'+esc(a.cat)+'</span>'
      +'<h1 style="margin:14px 0">'+esc(a.title)+'</h1>'
      +'<div class="creator-meta" style="justify-content:flex-start;margin-bottom:20px"><span>✍️ '+esc(a.author)+'</span><span>📅 '+esc(a.date)+'</span></div>'
      +'<img src="'+esc(a.img)+'" style="width:100%;border-radius:16px;margin-bottom:24px" alt="'+esc(a.title)+'">'
      +'<p style="font-size:1.1rem;color:var(--gray-900);font-weight:500">'+esc(a.excerpt)+'</p>'
      +'<p style="margin-top:16px">'+esc(a.body)+'</p>'
      +'<div class="divider"></div><div class="flex between wrap gap"><div>'+tags+'</div>'
      +'<div class="flex gap"><a class="btn btn-light btn-sm" target="_blank" rel="noopener" href="'+esc(soc.facebook)+'">Partager</a><a class="btn btn-ghost btn-sm" href="media.html">← Retour</a></div></div>';
  }
</script>
</body>
</html>
